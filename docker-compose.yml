# Local infrastructure for the FeeBilling practice repo.
#
#   docker compose up -d                                   SQL Server, Azurite, Service Bus emulator
#   dotnet run --project tools/FeeBilling.DbInit           create + seed FeeBilling / FeeBillingReporting
#   docker compose down -v                                 wipe everything
#
# ARM64 hosts (Apple Silicon, Windows on ARM): SQL Server 2022 images are amd64-only.
# Copy .env.example to .env and set SQL_IMAGE=mcr.microsoft.com/azure-sql-edge:latest,
# or skip the container and point DbInit at a local SQL Server / SQL Express instead.
#
# Dev-only credentials.
name: feebilling

services:
  sqlserver:
    image: ${SQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-FeeBilling!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # TCP probe: works for both the mssql/server and azure-sql-edge images (the latter has no sqlcmd).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"   # blob
      - "10001:10001"   # queue
      - "10002:10002"   # table
    volumes:
      - azuritedata:/data

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-FeeBilling!Passw0rd}
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"     # AMQP
      - "5300:5300"     # management / health

volumes:
  sqldata:
  azuritedata:
